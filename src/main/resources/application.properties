quarkus.application.name=service-track-auth-lambda
quarkus.http.port=8080
quarkus.banner.enabled=true
quarkus.log.level=INFO

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] [requestId=%X{requestId}] (%t) %s%e%n


mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION:}
mp.jwt.verify.issuer=service-track-api
smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION:}
servicetrack.jwt.expiracao-segundos=3600

quarkus.smallrye-openapi.enabled=false
quarkus.smallrye-openapi.path=/openapi

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:servicetrack}

# A Lambda atende uma requisicao por container de cada vez, entao pool acima de 2
# e desperdicio: cada container quente segura conexoes sem usar e a funcao escala
# horizontalmente sem teto compartilhado com a aplicacao. O padrao do Agroal, 20,
# esgotaria o banco sob concorrencia moderada.
# Orcamento definido em service-track-db-infra. Ver DB-ADR-004.
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:2}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.idle-removal-interval=1M
quarkus.datasource.jdbc.max-lifetime=15M
quarkus.datasource.jdbc.background-validation-interval=1M

quarkus.hibernate-orm.schema-management.strategy=none