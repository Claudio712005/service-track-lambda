name: CD

run-name: "CD auth -> ${{ inputs.env || 'hml' }} por @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'Dockerfile'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      env:
        description: Ambiente alvo
        required: true
        type: choice
        options: [hml, prd]
        default: hml
      image_tag:
        description: Tag ja publicada a promover. Vazio constroi a partir do commit atual.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-lambda-${{ inputs.env || 'hml' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  preparar:
    name: "1. Preparar"
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'hml' }}
    outputs:
      ambiente: ${{ steps.alvo.outputs.ambiente }}
      tag: ${{ steps.alvo.outputs.tag }}
      repositorio: ${{ steps.alvo.outputs.repositorio }}
      funcao: ${{ steps.alvo.outputs.funcao }}
      promover: ${{ steps.alvo.outputs.promover }}
    steps:
      - name: Definir ambiente e tag
        id: alvo
        run: |
          AMBIENTE="${{ inputs.env || 'hml' }}"
          TAG="${{ inputs.image_tag }}"
          if [ -n "$TAG" ]; then PROMOVER=true; else TAG="${{ github.sha }}"; PROMOVER=false; fi
          {
            echo "ambiente=$AMBIENTE"
            echo "tag=$TAG"
            echo "repositorio=servicetrack-$AMBIENTE-auth-lambda"
            echo "funcao=servicetrack-$AMBIENTE-auth"
            echo "promover=$PROMOVER"
          } >> "$GITHUB_OUTPUT"

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirmar que a infraestrutura do ambiente existe
        run: |
          FUNCAO="${{ steps.alvo.outputs.funcao }}"
          if ! aws lambda get-function --function-name "$FUNCAO" >/dev/null 2>&1; then
            echo "::error::A funcao $FUNCAO nao existe."
            echo "::error::Aplique antes a esteira Terraform do repositorio service-track-aws-iac para ${{ steps.alvo.outputs.ambiente }}."
            exit 1
          fi

  construir:
    name: "2. Construir a imagem"
    needs: preparar
    if: needs.preparar.outputs.promover == 'false'
    runs-on: ubuntu-latest
    environment: ${{ needs.preparar.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ needs.preparar.outputs.repositorio }}:${{ needs.preparar.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verificar:
    name: "3. Verificar a imagem"
    needs: [preparar, construir]
    if: always() && needs.preparar.result == 'success' && needs.construir.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ needs.preparar.outputs.ambiente }}
    env:
      REPO: ${{ needs.preparar.outputs.repositorio }}
      TAG: ${{ needs.preparar.outputs.tag }}
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirmar que a tag existe no ECR
        run: |
          aws ecr describe-images \
            --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null

      - name: Portao de vulnerabilidade
        run: |
          STATUS=PENDING
          for i in $(seq 1 30); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$TAG" \
              --query imageScanStatus.status --output text 2>/dev/null || echo PENDING)"
            case "$STATUS" in
              COMPLETE) break ;;
              FAILED) echo "::warning::scan do ECR falhou; seguindo sem o portao"; exit 0 ;;
              *) echo "aguardando scan do ECR... ($i/30)"; sleep 10 ;;
            esac
          done

          if [ "$STATUS" != "COMPLETE" ]; then
            echo "::warning::scan do ECR nao concluiu a tempo; seguindo sem o portao"
            exit 0
          fi

          CRITICAS="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)"
          [ "$CRITICAS" = "None" ] && CRITICAS=0

          echo "vulnerabilidades criticas: $CRITICAS"
          if [ "$CRITICAS" -gt 0 ]; then
            echo "::error::imagem com $CRITICAS vulnerabilidade(s) CRITICAL; deploy interrompido"
            exit 1
          fi

  entregar:
    name: "4. Atualizar a funcao"
    needs: [preparar, verificar]
    runs-on: ubuntu-latest
    environment: ${{ needs.preparar.outputs.ambiente }}
    env:
      FUNCAO: ${{ needs.preparar.outputs.funcao }}
      REPO: ${{ needs.preparar.outputs.repositorio }}
      TAG: ${{ needs.preparar.outputs.tag }}
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Atualizar o codigo da funcao
        run: |
          IMAGEM="${{ steps.ecr.outputs.registry }}/$REPO:$TAG"
          aws lambda update-function-code \
            --function-name "$FUNCAO" \
            --image-uri "$IMAGEM" \
            --publish >/dev/null
          aws lambda wait function-updated --function-name "$FUNCAO"
          echo "funcao $FUNCAO atualizada para $IMAGEM"

      - name: Confirmar que a funcao esta saudavel
        run: |
          ESTADO="$(aws lambda get-function-configuration \
            --function-name "$FUNCAO" --query 'State' --output text)"
          ULTIMO="$(aws lambda get-function-configuration \
            --function-name "$FUNCAO" --query 'LastUpdateStatus' --output text)"
          echo "State=$ESTADO LastUpdateStatus=$ULTIMO"
          if [ "$ESTADO" != "Active" ] || [ "$ULTIMO" != "Successful" ]; then
            echo "::error::A funcao nao ficou saudavel apos a atualizacao."
            aws lambda get-function-configuration --function-name "$FUNCAO" \
              --query '{State:State,Reason:StateReason,Update:LastUpdateStatusReason}' --output table || true
            exit 1
          fi

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Funcao de autenticacao — ${{ needs.preparar.outputs.ambiente }}"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Funcao | \`$FUNCAO\` |"
            echo "| Repositorio ECR | \`$REPO\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Resultado | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
