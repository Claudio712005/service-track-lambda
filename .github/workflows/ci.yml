name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-guard:
    name: Secret guard (PEM keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a private key is tracked by git
        run: |
          echo "Checking for tracked private keys..."
          tracked=$(git ls-files | grep -E '(privateKey\.pem$|private.*\.pem$|.*_rsa$|\.key$)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Private key material is tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no private key material tracked."

      - name: Fail if a PEM contains a PRIVATE KEY block
        run: |
          echo "Scanning tracked *.pem for private key blocks..."
          hit=0
          while IFS= read -r f; do
            if grep -qE 'BEGIN [A-Z0-9 ]*PRIVATE KEY' "$f"; then
              echo "::error::$f contains a PRIVATE KEY block"
              hit=1
            fi
          done < <(git ls-files '*.pem')
          [ "$hit" -eq 0 ] && echo "OK: no private key blocks in tracked PEM files."
          exit $hit

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: secret-guard
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build (skip tests, already run)
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore